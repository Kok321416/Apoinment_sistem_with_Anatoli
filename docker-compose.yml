services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-appointment_db}
      MYSQL_USER: ${DB_USER:-appointment_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app_network
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    volumes:
      - .:/app
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${DB_NAME:-appointment_db}
      - DB_USER=${DB_USER:-appointment_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PERF_SLOW_MS=${PERF_SLOW_MS:-500}
      - PERF_TIMING_HEADER=${PERF_TIMING_HEADER:-true}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SITE_URL=${SITE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - BOT_API_SECRET=${BOT_API_SECRET}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - ADMIN_TELEGRAM_USERNAME=${ADMIN_TELEGRAM_USERNAME:-andrievskypsy}
      - TELEGRAM_ALERT_CHAT_IDS=${TELEGRAM_ALERT_CHAT_IDS:-}
    networks:
      - app_network

  # Long-polling fallback. Prefer webhook: set TELEGRAM_WEBHOOK_SECRET on `web` and omit this service.
  bot:
    profiles: ["polling"]
    build: .
    command: python -m bot.run
    volumes:
      - .:/app
    depends_on:
      - web
    environment:
      - DB_NAME=${DB_NAME:-appointment_db}
      - DB_USER=${DB_USER:-appointment_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - BOT_API_SECRET=${BOT_API_SECRET}
      - SITE_URL=${SITE_URL}
      - SITE_INTERNAL_URL=${SITE_INTERNAL_URL:-http://web:8000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ADMIN_TELEGRAM_USERNAME=${ADMIN_TELEGRAM_USERNAME:-andrievskypsy}
      - TELEGRAM_ALERT_CHAT_IDS=${TELEGRAM_ALERT_CHAT_IDS:-}
    networks:
      - app_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - app_network
    restart: unless-stopped

volumes:
  mysql_data:
  media_volume:

networks:
  app_network:
    driver: bridge
