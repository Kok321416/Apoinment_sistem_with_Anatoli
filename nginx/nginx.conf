user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 12M;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 12s;
    reset_timedout_connection on;

    # Soft anti-flood at the edge (app also rate-limits).
    limit_req_zone $binary_remote_addr zone=app_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=app_auth:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=app_conn:10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    include /etc/nginx/conf.d/*.conf;
}
