{% if yandex_metrika_id %}
<!-- Yandex.Metrika: loads only after analytics consent (Compliance) -->
<script type="text/javascript">
(function () {
    var metrikaId = {{ yandex_metrika_id }};

    function loadMetrika() {
        if (window.__aycMetrikaLoaded) return;
        window.__aycMetrikaLoaded = true;
        (function (m, e, t, r, i, k, a) {
            m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
            m[i].l = 1 * new Date();
            for (var j = 0; j < document.scripts.length; j++) {
                if (document.scripts[j].src === r) { return; }
            }
            k = e.createElement(t); a = e.getElementsByTagName(t)[0];
            k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
        })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js?id=" + metrikaId, "ym");

        ym(metrikaId, "init", {
            ssr: true,
            webvisor: false,
            clickmap: true,
            accurateTrackBounce: true,
            trackLinks: true
        });
    }

    function maybeLoad() {
        if (window.aycConsent && window.aycConsent.allowsAnalytics()) {
            if ("requestIdleCallback" in window) {
                requestIdleCallback(loadMetrika, { timeout: 4000 });
            } else {
                setTimeout(loadMetrika, 800);
            }
        }
    }

    window.addEventListener("ayc-consent-changed", maybeLoad);
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", maybeLoad);
    } else {
        maybeLoad();
    }
})();
</script>
{% endif %}
