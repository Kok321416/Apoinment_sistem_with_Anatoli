<style id="ayc-tg-loading-css">
#ayc-tg-loading{position:fixed;inset:0;z-index:99990;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;box-sizing:border-box;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ayc-tg-loading.is-on,#ayc-tg-loading[aria-hidden="false"]{display:flex!important}
#ayc-tg-loading[hidden]{display:none!important}
.ayc-tg-spinner{width:36px;height:36px;border:3px solid #e5e5e5;border-top-color:#111;border-radius:50%;animation:ayc-tg-spin .75s linear infinite}
.ayc-tg-loading__text{margin:0;font-size:15px;line-height:1.4;color:#525252;text-align:center;max-width:16rem}
@keyframes ayc-tg-spin{to{transform:rotate(360deg)}}
</style>
<div id="ayc-tg-loading" hidden aria-hidden="true" role="status" aria-live="polite" aria-busy="true">
    <div class="ayc-tg-spinner" aria-hidden="true"></div>
    <p class="ayc-tg-loading__text" id="ayc-tg-loading-text">Загрузка…</p>
</div>
<script>
(function () {
    var SDK = "/static/js/vendor/telegram-web-app.js?v=1";
    var BOOT = "/static/js/telegram-webapp.js?v=32";

    function looksTelegram() {
        try {
            var ua = navigator.userAgent || "";
            var tg = window.Telegram && window.Telegram.WebApp;
            if (/Telegram/i.test(ua)) return true;
            if (tg && (tg.initData || tg.platform === "ios" || tg.platform === "android")) return true;
            if (String(location.hash || "").indexOf("tgWebApp") >= 0) return true;
        } catch (e) {}
        return false;
    }

    function earlyShowLoading(text) {
        var el = document.getElementById("ayc-tg-loading");
        if (!el) return;
        var t = document.getElementById("ayc-tg-loading-text");
        if (t && text) t.textContent = text;
        el.hidden = false;
        el.classList.add("is-on");
        el.setAttribute("aria-hidden", "false");
    }

    if (looksTelegram()) {
        earlyShowLoading("Открываем…");
    }

    window.__AYC_TG_REPORT__ = function (kind, extra) {
        if (!looksTelegram()) return;
        var tg = window.Telegram && window.Telegram.WebApp;
        var payload = JSON.stringify({
            kind: kind || "watchdog",
            path: (location.pathname || "/tg/").slice(0, 180),
            platform: (tg && tg.platform) || "",
            ua: (navigator.userAgent || "").slice(0, 220),
            extra: String(extra || "").slice(0, 400),
        });
        try {
            if (navigator.sendBeacon) {
                navigator.sendBeacon("/api/telegram/webapp-diag", new Blob([payload], { type: "application/json" }));
                return;
            }
        } catch (e) {}
        try {
            fetch("/api/telegram/webapp-diag", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: payload,
                keepalive: true,
            }).catch(function () {});
        } catch (e2) {}
    };

    window.addEventListener("error", function (ev) {
        window.__AYC_TG_REPORT__("js_error", (ev.message || "") + " " + (ev.filename || "") + ":" + (ev.lineno || ""));
    });
    window.addEventListener("unhandledrejection", function (ev) {
        window.__AYC_TG_REPORT__("promise", String(ev.reason || ""));
    });
    setTimeout(function () {
        if (!looksTelegram()) return;
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) window.__AYC_TG_REPORT__("no_sdk", "no WebApp after 4s");
        var shell = document.getElementById("tg-scroll-root");
        if (shell && shell.clientHeight < 50) window.__AYC_TG_REPORT__("blank_shell", "h=" + shell.clientHeight);
    }, 4000);

    function loadBoot() {
        if (window.__AYC_TG_BOOT_LOADED__) return;
        window.__AYC_TG_BOOT_LOADED__ = true;
        var boot = document.createElement("script");
        boot.src = BOOT;
        boot.async = false;
        (document.head || document.documentElement).appendChild(boot);
    }

    function loadSdk() {
        if (window.Telegram && window.Telegram.WebApp) {
            loadBoot();
            return;
        }
        var sdk = document.createElement("script");
        sdk.src = SDK;
        sdk.async = false;
        sdk.onload = loadBoot;
        sdk.onerror = function () {
            if (window.__AYC_TG_REPORT__) window.__AYC_TG_REPORT__("no_sdk", "sdk onerror");
            loadBoot();
        };
        (document.head || document.documentElement).appendChild(sdk);
    }

    loadSdk();
})();
</script>
