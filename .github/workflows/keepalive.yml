# Keep Passenger worker warm on shared hosting (reg.ru).
# Without this, idle process sleeps and the next real user waits ~8–15s cold start.
# Also triggers booking reminders (same schedule) via /internal/cron/reminders/.
name: Keep-alive health ping

on:
  schedule:
    # Every 5 minutes (UTC). GitHub may delay a few minutes under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping production /health and Mini App /tg/
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          set -euo pipefail
          HEALTH="${KEEPALIVE_URL:-https://allyourclients.ru/health}"
          HUB="https://allyourclients.ru/tg/"
          ping_one() {
            local url="$1"
            echo "Pinging $url"
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 45 \
              -H "User-Agent: TelegramBot (like TwitterBot)" \
              "$url" || true)
            echo "HTTP $code for $url"
            if [ "$code" != "200" ]; then
              echo "Keep-alive ping failed for $url"
              return 1
            fi
          }
          ping_one "$HEALTH"
          ping_one "$HUB"
          curl -fsS -o /dev/null --connect-timeout 10 --max-time 20 \
            "https://allyourclients.ru/static/js/vendor/telegram-web-app.js?v=1" || true

      - name: Run booking reminders cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          REMINDERS_URL: ${{ vars.REMINDERS_CRON_URL }}
        run: |
          set -euo pipefail
          TOKEN="${CRON_SECRET:-${BOT_API_SECRET:-}}"
          if [ -z "$TOKEN" ]; then
            echo "No CRON_SECRET / BOT_API_SECRET in GitHub secrets — skip reminders."
            exit 0
          fi
          URL="${REMINDERS_URL:-https://allyourclients.ru/internal/cron/reminders/}"
          echo "Calling $URL"
          curl -fsS -X POST "$URL" \
            -H "X-Cron-Secret: ${TOKEN}" \
            --connect-timeout 15 --max-time 90 \
            -o /tmp/reminders.json -w "HTTP %{http_code}\n" || true
          if [ -f /tmp/reminders.json ]; then
            head -c 500 /tmp/reminders.json || true
            echo
          fi
